<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AdPulseAI Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        :root { --sidebar-width: 280px; }
        body { background-color: #f8f9fa; font-family: 'Inter', sans-serif; }
        #sidebar { width: var(--sidebar-width); height: 100vh; position: fixed; background: #111; color: white; padding: 20px; }
        #main-content { margin-left: var(--sidebar-width); padding: 40px; }
        .history-item { padding: 12px; border-bottom: 1px solid #333; cursor: pointer; transition: 0.2s; }
        .history-item:hover { background: #222; color: #0d6efd; }
        .tab-pane { padding: 25px; border: 1px solid #dee2e6; border-top: 0; background: white; white-space: pre-wrap; border-radius: 0 0 8px 8px; }
        .profile-img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #0d6efd; cursor: pointer; }
    </style>
</head>
<body>

<div id="login-overlay" style="position:fixed; inset:0; background:#f8f9fa; z-index:2000; display:flex; align-items:center; justify-content:center;">
    <div class="card p-4 shadow-lg border-0" style="width: 380px;">
        <h2 class="text-center text-primary fw-bold mb-4">AdPulseAI</h2>
        <form id="login-form">
            <input type="text" id="username" class="form-control mb-2" placeholder="Username" required>
            <input type="password" id="password" class="form-control mb-3" placeholder="Password" required>
            <button class="btn btn-primary w-100 fw-bold">Sign In</button>
        </form>
    </div>
</div>

<div id="app-wrapper" style="display: none;">
    <nav id="sidebar">
        <h3 class="fw-bold mb-4 text-primary">AdPulseAI</h3>
        <p class="text-secondary small fw-bold text-uppercase">Activity History</p>
        <div id="history-list" class="overflow-auto" style="max-height: 80vh;"></div>
    </nav>

    <main id="main-content">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h2 class="fw-bold">Campaign Suite</h2>
            <div class="dropdown">
                <img src="https://ui-avatars.com/api/?background=0D6EFD&color=fff&name=User" class="profile-img dropdown-toggle" id="pMenu" data-bs-toggle="dropdown">
                <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                    <li class="px-3 py-2 border-bottom">
                        <div id="display-name" class="fw-bold">User</div>
                        <small id="display-role" class="text-muted text-uppercase">Role</small>
                    </li>
                    <li><a class="dropdown-item text-danger mt-2" href="#" onclick="logout()">Logout</a></li>
                </ul>
            </div>
        </div>

        <div class="card p-4 shadow-sm mb-5 border-0">
            <textarea id="prod-info" class="form-control mb-3" rows="3" placeholder="Describe product..."></textarea>
            <button id="gen-btn" class="btn btn-primary fw-bold px-5 py-2 float-end">Generate</button>
        </div>

        <div id="result-container" class="d-none">
            <h3 id="current-prompt-heading" class="mb-4 text-primary fw-bold"></h3>
            <ul class="nav nav-tabs">
                <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#fb">Facebook</button></li>
                <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#ig">Instagram</button></li>
                <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tw">Twitter</button></li>
                <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#wa">WhatsApp</button></li>
            </ul>
            <div class="tab-content shadow-sm">
                <div class="tab-pane fade show active" id="fb" role="tabpanel"></div>
                <div class="tab-pane fade" id="ig" role="tabpanel"></div>
                <div class="tab-pane fade" id="tw" role="tabpanel"></div>
                <div class="tab-pane fade" id="wa" role="tabpanel"></div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const getHeaders = () => ({ 'Authorization': 'Bearer ' + localStorage.getItem('at'), 'Content-Type': 'application/json' });

    function displayContent(rawText, title) {
        document.getElementById('current-prompt-heading').innerText = "Campaign: " + title;
        const platforms = ['FACEBOOK', 'INSTAGRAM', 'TWITTER', 'WHATSAPP'];
        platforms.forEach((p, i) => {
            const marker = p + ':';
            const nextMarker = platforms[i+1] ? platforms[i+1] + ':' : null;
            let start = rawText.indexOf(marker);
            if(start !== -1) {
                start += marker.length;
                let end = nextMarker ? rawText.indexOf(nextMarker) : rawText.length;
                let content = rawText.substring(start, end).trim();
                const id = p === 'TWITTER' ? 'tw' : p === 'WHATSAPP' ? 'wa' : p.toLowerCase();
                document.getElementById(id).innerText = content;
            }
        });
        document.getElementById('result-container').classList.remove('d-none');
    }

    async function refreshHistory() {
        const r = await fetch('/api/history', { headers: getHeaders() });
        if (r.ok) {
            const history = await r.json();
            document.getElementById('history-list').innerHTML = history.map(h => `
                <div class="history-item" onclick="displayContent('${encodeURIComponent(h.full_content)}', '${h.prompt_preview}')">
                    <div class="fw-bold text-truncate">${h.prompt_preview}</div>
                    <small class="text-muted">${h.timestamp}</small>
                </div>`).join('');
        }
    }

    document.getElementById('gen-btn').onclick = async () => {
        const btn = document.getElementById('gen-btn');
        const info = document.getElementById('prod-info').value;
        if (!info) return;
        btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Syncing...';
        
        try {
            const r = await fetch('/api/generate', { method: 'POST', headers: getHeaders(), body: JSON.stringify({ product_info: info, voice: 'Professional' }) });
            const d = await r.json();
            if (r.ok) {
                displayContent(d.content, info.substring(0, 30));
                setTimeout(async () => { await refreshHistory(); btn.disabled = false; btn.innerText = "Generate"; }, 600);
            }
        } catch (e) { btn.disabled = false; btn.innerText = "Generate"; }
    };

    document.getElementById('login-form').onsubmit = async (e) => {
        e.preventDefault();
        const f = new FormData();
        f.append('username', document.getElementById('username').value);
        f.append('password', document.getElementById('password').value);
        const r = await fetch('/token', { method: 'POST', body: f });
        if (r.ok) {
            const d = await r.json();
            localStorage.setItem('at', d.access_token);
            localStorage.setItem('role', d.role);
            localStorage.setItem('user', document.getElementById('username').value);
            location.reload();
        }
    };

    window.onload = () => {
        const token = localStorage.getItem('at');
        if (token) {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('app-wrapper').style.display = 'block';
            document.getElementById('display-name').innerText = localStorage.getItem('user');
            document.getElementById('display-role').innerText = localStorage.getItem('role');
            refreshHistory();
        }
    };

    function logout() { localStorage.clear(); location.reload(); }
</script>
</body>
</html>
